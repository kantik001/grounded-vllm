[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-vllm"
version = "0.1.0"
description = "vLLM serving-path adapter: OpenAI-compatible proxy + grounded-guardrails verify"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kantemir Satibalov" }]
dependencies = [
  "grpcio>=1.62",
  "protobuf>=5.26",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "starlette>=0.38",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "grpcio-tools>=1.62"]
vllm = ["vllm>=0.6.0"]

[project.scripts]
grounded-vllm = "grounded_vllm.cli:main"

[project.entry-points."vllm.logits_processors"]
grounded_verify = "grounded_vllm.logits_processor:GroundedAdapterLogitsProcessor"

[tool.setuptools.packages.find]
include = ["grounded_vllm*"]

[tool.setuptools.package-data]
grounded_vllm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
